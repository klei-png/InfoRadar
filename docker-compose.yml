services:
  db:
    image: pgvector/pgvector:pg16
    container_name: inforradar_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: inforadar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d inforadar"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: inforradar_app
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
